<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Driver Route Assistant</title>

  <!-- CSS -->
  <link rel="stylesheet" href="driver.css">
  <link rel="stylesheet" href="global.css">

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

  <div class="left"></div>

  <div class="right">
    <div class="driver-container">

      <h2>🚚 Driver Route Assistant</h2>
      <p class="subtitle">
        AI-powered route, fuel, parking & rest guidance for drivers
      </p>

      <!-- INPUT CARD -->
      <div class="driver-card">
        <div class="form-group">
          <label>From Location</label>
          <input id="fromCity" placeholder="Pune">
        </div>

        <div class="form-group">
          <label>To Location</label>
          <input id="toCity" placeholder="Nanded">
        </div>

        <button onclick="getRoute()">Get Best Route</button>
      </div>

      <!-- AI OUTPUT -->
      <div class="ai-box">
        <h3>🤖 AI Route Suggestion</h3>
        <pre id="result">Enter locations and click “Get Best Route”.</pre>
      </div>

      <!-- MAP -->
      <div class="map-box">
        <h3>🗺 Route Map & Facilities</h3>
        <div id="map"></div>
      </div>

    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="menu.js"></script>
  <script src="driver interface.js"></script>

</body>

</html>
