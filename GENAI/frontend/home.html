<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Home - Vahak</title>
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="global.css" />
</head>

<body>
    <div class="container">
        <div class="left">
            <!-- Optional sidebar content -->
        </div>

        <div class="right">
            <!-- Membership Banner -->
            <section class="membership">
                <div class="membership-banner">
                    <div class="user-info">
                        <img src="home.png" alt="User Image">
                    </div>
                    <div class="content">
                        <h2>All new New Fetures!</h2>
                        <p>Generative AI in Transportation and Logistics</p>
                    </div>
                </div>
            </section>

            <!-- Stats -->
            <section class="stats">
                <div class="stat-box">

                    <img src="customer.jpg" alt="User Image" class="mmm">
                    <p>Customer interface</p>
                    <a href="customer-interface.html" class="btn customer-btn">
                        Explore now
                    </a>
                </div>
                <div class="stat-box">

                    <img src="driver.jpg" alt="User Image" class="mmm">
                    <p>Driver interface</p>
                    <a href="Driver-interface.html" class="btn customer-btn">
                        Explore Now
                    </a>
                </div>
                <div class="stat-box">

                    <img src="owener.jpg" alt="User Image" class="mmm">
                    <p>Owner Interface</p>
                    <a href="Owener interface.html" class="btn customer-btn">
                        Explore Now
                    </a>
                </div>
            </section>
            <!-- Chatbot Button -->
            <div id="chatbot-toggle">💬</div>

            <!-- Chatbot Window -->
            <div id="chatbot">
                <div class="chat-header">
                    <span>GenAI Assistant</span>
                    <select id="chatRole">
                        <option value="customer">Customer</option>
                        <option value="driver">Driver</option>
                        <option value="owner">Owner</option>
                    </select>
                    <button onclick="toggleChat()">✖</button>
                </div>

                <div id="chatMessages"></div>

                <div class="chat-input">
                    <input type="text" id="chatText" placeholder="Ask something..." />
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>

            <script src="chatbot.js"></script>





        </div>
    </div>
    <script src="menu.js"></script>
    <script src="home.js"></script>
</body>

</html>
